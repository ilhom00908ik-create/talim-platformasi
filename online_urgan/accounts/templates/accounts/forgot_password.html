{% extends 'accounts/base.html' %}
{% block title %}Tiklash - Online Urgan{% endblock %}

{% block content %}
<div class="mx-auto max-w-md py-10">
    <div class="glass rounded-[30px] p-7 sm:p-8">
        <div class="mb-6 text-center">
            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-amber-200">Tiklash</p>
            <h2 class="mt-3 text-3xl font-black text-white">Ma&apos;lumotlarni tiklash</h2>
        </div>

        {% if error %}
            <div class="mb-4 rounded-xl border border-rose-400/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-100">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="mb-4 rounded-xl border border-emerald-400/30 bg-emerald-500/10 px-3 py-2 text-sm text-emerald-100">{{ success }}</div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="mb-2 block text-sm font-medium text-slate-200">Email yoki Telefon raqamingiz</label>
                <input type="text" name="phone_or_email" class="w-full rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400/80" placeholder="Email yoki tel raqam" required>
            </div>
            <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 px-4 py-3 font-bold text-white shadow-lg shadow-amber-500/20 transition hover:opacity-95">Ma&apos;lumotlarni yuborish</button>
        </form>

        <div class="mt-5 text-center text-sm text-slate-300">
            <a href="{% url 'login' %}" class="text-cyan-200 hover:text-cyan-100">Orqaga (Tizimga kirish)</a>
        </div>
    </div>
</div>
{% endblock %}
