<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(34,211,238,0.2), transparent 28%),
                radial-gradient(circle at bottom right, rgba(168,85,247,0.18), transparent 26%),
                linear-gradient(135deg, #020817 0%, #0f172a 50%, #111827 100%);
        }
        .glass {
            background: rgba(15, 23, 42, 0.42);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.35);
        }
        .field input, .field textarea, .field select {
            width: 100%;
            border-radius: 0.9rem;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: white;
            padding: 0.75rem 0.9rem;
            outline: none;
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.35);
            border-color: rgba(34,211,238,0.6);
        }
        .field label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgb(226 232 240);
            font-size: 0.875rem;
        }
        .field { margin-bottom: 1rem; }
        .field p { margin: 0; }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-4 py-10">
        <div class="glass w-full max-w-md rounded-[30px] p-7 sm:p-8">
            <div class="mb-6 text-center">
                <p class="text-xs font-semibold uppercase tracking-[0.25em] text-cyan-200">Kabinet</p>
                <h1 class="mt-3 text-3xl font-black">Kirish</h1>
            </div>

            {% if messages %}
                <div class="mb-5 space-y-2">
                    {% for message in messages %}
                        <div class="rounded-xl border border-yellow-400/30 bg-yellow-500/10 px-3 py-2 text-sm text-yellow-100">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="field">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="mt-4 w-full rounded-2xl bg-gradient-to-r from-cyan-500 to-violet-500 px-4 py-3 font-bold text-white shadow-lg shadow-cyan-500/20 hover:opacity-95">
                    Kirish
                </button>
            </form>
        </div>
    </div>
</body>
</html>
